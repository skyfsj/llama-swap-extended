id: web-search-exa
name: Exa Web Search
enabled: true
description: Search with the Exa API (https://api.exa.ai/search). Exa is a neural search engine that matches meaning rather than keywords, and it returns each result with query-relevant excerpts, which is cheaper for the model than reading whole pages. Requires an Exa API key.
priority: 100
match:
  endpoints: [chat.completions, responses, anthropic.messages]
permissions:
  networkHosts: [api.exa.ai]
timeout: 30s
maxCpuMillis: 3000
maxMemoryMiB: 256
