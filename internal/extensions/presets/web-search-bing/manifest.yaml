id: web-search-bing
name: Bing Web Search
enabled: true
description: Search the web with the Microsoft Bing Web Search v7 API. Requires a Bing Search v7 subscription key.
priority: 100
match:
  endpoints: [chat.completions, responses, anthropic.messages]
permissions:
  networkHosts: [api.bing.microsoft.com]
timeout: 15s
maxCpuMillis: 2000
maxMemoryMiB: 256
