id: web-search-glm
name: GLM Web Search
enabled: true
description: Search the web with the Zhipu GLM (bigmodel) web search tool API (POST /api/paas/v4/web_search). Requires a Zhipu API key.
priority: 100
match:
  endpoints: [chat.completions, responses, anthropic.messages]
permissions:
  networkHosts: [open.bigmodel.cn]
timeout: 15s
maxCpuMillis: 2000
maxMemoryMiB: 256
