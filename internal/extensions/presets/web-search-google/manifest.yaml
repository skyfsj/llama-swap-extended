id: web-search-google
name: Google Web Search (SerpApi)
enabled: true
description: Search Google through SerpApi (engine=google). Requires a SerpApi API key.
priority: 100
match:
  endpoints: [chat.completions, responses, anthropic.messages]
permissions:
  networkHosts: [serpapi.com]
timeout: 15s
maxCpuMillis: 2000
maxMemoryMiB: 256
