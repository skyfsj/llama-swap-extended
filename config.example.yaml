# add this modeline for validation in vscode
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap YAML configuration example
# -------------------------------------
#
# 💡 Tip - Use an LLM with this file!
# ====================================
#  This example configuration is written to be LLM friendly. Try
#  copying this file into an LLM and asking it to explain or generate
#  sections for you.
# ====================================

# Usage notes:
# - Below are all the available configuration options for llama-swap.
# - Settings noted as "required" must be in your configuration file
# - Settings noted as "optional" can be omitted

# healthCheckTimeout: number of seconds to wait for a model to be ready to serve requests
# - optional, default: 120
# - minimum value is 15 seconds, anything less will be set to this value
healthCheckTimeout: 500

protocolRuntime:
  mcp:
    enabled: false
    servers: {}

# logLevel: sets the logging value
# - optional, default: info
# - Valid log levels: debug, info, warn, error
logLevel: info

# logTimeFormat: enables and sets the logging timestamp format
# - optional, default (disabled): ""
# - Valid values: "", "ansic", "unixdate", "rubydate", "rfc822", "rfc822z",
#   "rfc850", "rfc1123", "rfc1123z", "rfc3339", "rfc3339nano", "kitchen",
#   "stamp", "stampmilli", "stampmicro", and "stampnano".
# - For more info, read: https://pkg.go.dev/time#pkg-constants
logTimeFormat: ""

# logToStdout: controls what is logged to stdout
# - optional, default: "proxy"
# - valid values:
#   - "proxy": logs generated by llama-swap when swapping models,
#      handling requests, etc.
#   - "upstream": a copy of an upstream processes stdout logs
#   - "both": both the proxy and upstream logs interleaved together
#   - "none": no logs are ever written to stdout
logToStdout: "proxy"

# logStorage: durable snapshots for inference crashes and failed requests
# - optional, default maxFiles: 5 per incident kind
# - snapshots contain process-output tails or request metadata, never request bodies
# - path is optional; when empty, use ./logs (or the directory beside store.path)
# logStorage:
#   path: ./logs
#   maxFiles: 5

# store: persistent storage for activity metrics state
# - optional, default: in-memory sqlite database capped by metricsMaxInMemory
# - path is a sqlite database file path
# - file-backed sqlite keeps activity logs across restarts
# store:
#   path: /path/to/file.sqlite

# metricsMaxInMemory: maximum number of metrics to keep in memory
# - optional, default: 1000
# - controls how many metrics are stored in memory before older ones are discarded
# - useful for limiting memory usage when processing large volumes of metrics
# - when persistent sqlite storage is defined in store.path this has no effect
metricsMaxInMemory: 1000

# modelFiles: model-file catalog exposed in the control UI
# - optional, default: scans automatically discovered Hugging Face and ModelScope caches
# - source type "directory" scans model-looking files recursively
# - source type "file" exposes one model file
# - source type "hf_cache" scans Hugging Face Hub snapshots; omit path to use
#   HF_HUB_CACHE, HF_HOME, XDG_CACHE_HOME, or the platform cache directory
# - source type "modelscope_cache" scans ModelScope snapshots; omit path to use
#   MODELSCOPE_CACHE, XDG_CACHE_HOME, or the platform cache directory
# - paths must be absolute; missing sources are shown as unavailable
modelFiles:
  maxFiles: 2000
  maxDepth: 8
  downloads:
    enabled: true
    workers: 1
    fileWorkers: 4
    # Large single files are split into resumable HTTP Range chunks.
    chunkWorkers: 4
    chunkSizeMiB: 16
    chunkThresholdMiB: 64
    maxRetries: 5
    # After request retries are exhausted, retry transient task failures.
    maxTaskRetries: 3
    retryBackoff: 2s
    hfBaseURL: https://huggingface.co
    hfTokenEnv: HF_TOKEN
    # Optional: configure this from the Model files page. The value is
    # redacted by the control API; prefer an environment-backed secret in
    # production.
    # hfToken: hf_example_token
    modelScopeBaseURL: https://modelscope.cn
    modelScopeTokenEnv: MODELSCOPE_API_TOKEN
    # Optional: configure this from the Model files page.
    # modelScopeToken: ms_example_token
  sources:
    local-models:
      type: directory
      path: /path/to/models
      recursive: true
    huggingface:
      type: hf_cache
    modelscope:
      type: modelscope_cache

# ui.activity.session_id: ordered request headers used to identify sessions in
# the Activity page's in-flight request table.
# - optional, default: ["X-Session-ID", "X-Litellm-Session-Id"]
# - matching is case-insensitive; the first non-empty matching header is shown
# - set to [] to disable session ID lookup
ui:
  activity:
    session_id: ["X-Session-ID", "X-Litellm-Session-Id"]

# performance: configuration for system monitoring statistics
# - timing values are duration strings like 1s, 1h30m, 90m, 2h10s, etc.
performance:
  # disabled: boolean
  # - default: false
  disabled: false

  # every: delay between polling for new performance statistics
  # - default: 5s
  # - minimum duration 5s
  every: 15s

# power: GPU/node power monitoring, energy statistics and electricity cost.
# - GPU-level power comes from nvidia-smi (or the platform equivalent); the
#   activity page attributes energy to models via each model's GPU config
#   (launch.gpus / container.gpus).
# - Node-level power uses a local ipmitool when available (DCMI preferred,
#   sensor readings as fallback); otherwise costs use GPU power only.
# - Energy is persisted to the store; costs are computed with the price in
#   effect when each sample was written.
power:
  # disabled: boolean
  # - default: false
  disabled: false

  # electricityPricePerKwh: base electricity price per kWh
  # - default: 0 (no cost accounting until configured)
  # - when no tariffs are configured every sample uses this price
  electricityPricePerKwh: 0

  # currency: label shown with cost figures
  # - default: CNY
  currency: CNY

  # tariffs: optional time-of-use price windows (HH:MM local time)
  # - windows must not overlap; end earlier than start wraps past midnight
  # - uncovered times fall back to electricityPricePerKwh
  # tariffs:
  #   - name: peak
  #     pricePerKwh: 1.0
  #     start: "08:00"
  #     end: "22:00"
  #   - name: valley
  #     pricePerKwh: 0.3
  #     start: "22:00"
  #     end: "06:00"

  # retentionDays: how many days of samples/occupancy to keep
  # - default: 90
  retentionDays: 90

  # flushInterval: how often sampled power is aggregated into the store
  # - default: 60s
  # - minimum duration 15s
  flushInterval: 60s

  # ipmi: node-level power collector
  # - command overrides the ipmitool binary path (empty = use PATH)
  ipmi:
    disabled: false
    command: ""

  # thermalGuard: overheat protection (optional, off unless configured)
  # - when a GPU crosses stopC every model occupying that card is stopped and
  #   parked in maintenance mode until the card cools below resumeC
  # - requests for parked models are forwarded to configured providers
  #   (gateway) or peers instead of answering 503; set failover: false to
  #   disable forwarding
  # thermalGuard:
  #   stopC: 85          # stop models at this core temperature (Celsius)
  #   resumeC: 80        # release maintenance below this temperature
  #   consecutive: 3     # hot samples before acting (one per performance.every)
  #   failover: true     # forward parked models' requests to providers/peers

# startPort: sets the starting port number for the automatic ${PORT} macro.
# - optional, default: 5800
# - the ${PORT} macro can be used in model.cmd and model.proxy settings
# - it is automatically incremented for every model that uses it
# - ports are handed out by model ID order, so adding or removing a model can
#   move the ports of the models that sort after it. That move is not treated as
#   a configuration change for those models: they keep running on the port they
#   were started with until they are restarted. Write the port explicitly when a
#   model must keep one across edits.
startPort: 10001

# sendLoadingState: inject loading status updates into the reasoning (thinking)
# field
# - optional, default: false
# - when true, a stream of loading messages will be sent to the client in the
#   reasoning field so chat UIs can show that loading is in progress.
# - see #366 for more details
sendLoadingState: true

# includeAliasesInList: present aliases within the /v1/models OpenAI API listing
# - optional, default: false
# - when true, model aliases will be output to the API model listing duplicating
#   all fields except for Id so chat UIs can use the alias equivalent to the original.
includeAliasesInList: false

# globalTTL: the default TTL in seconds before unloading a model
# - optional, default: 0 — omitting it or setting 0 both mean "never
#   automatically unload"
# - must be >= 0
globalTTL: 0

# unloadTimeout: graceful timeout in seconds when unloading a model (manual, API, or ttl expiry)
# - optional, default: 10
# - used before force-killing the model process on unload
# - can be overridden per model with model.unloadTimeout
# - large values extend how long an unload can take when a process does not exit cleanly
unloadTimeout: 10

# globalConcurrencyLimit: caps the number of inference requests served at once
# across all models combined
# - optional, default: 0 (no limit)
# - unlike models.*.concurrencyLimit, this is a single semaphore shared by
#   every model rather than a per-model limit
# - requests that exceed the limit receive an HTTP 429 Too Many Requests
#   response immediately, rather than being queued
# - see issue #1086
globalConcurrencyLimit: 0

# rollbackOnModelStartFailure: what happens when a model fails to start with a
#   newly applied configuration
# - optional, default: true
# - true: restore the last configuration that started, so the model keeps serving
# - false: keep the new configuration but take the model out of service. It
#   refuses to be started by incoming requests and exits that state on its own
#   once a later start succeeds and serves a request. See "Maintenance mode".
rollbackOnModelStartFailure: true

# macros: a dictionary of string substitutions
# - optional, default: empty dictionary
# - macros are reusable snippets
# - global macros can be used in any configuration value
# - model macros can be used in any value within that model
# - useful for reducing common configuration settings
# - macro names are strings and must be less than 64 characters
# - macro names must match the regex ^[a-zA-Z0-9_-]+$
# - macro names must not be a reserved name: PID, PORT, or MODEL_ID
# - macro values can be numbers, bools, or strings
# - macros can contain other macros, but they must be defined before they are used
# - environment variables can be referenced with ${env.VAR_NAME} syntax
#   - env macros are substituted first, before regular macros
#   - if the env var is not set, config loading will fail with an error
# - ${PORT} is assigned while loading each model that uses it in cmd
# - ${PID} is substituted when a model's cmdStop runs
macros:
  # Example of a multi-line macro
  "latest-llama": >
    /path/to/llama-server/llama-server-ec9e0301 --port ${PORT}

  "default_ctx": 4096

  # Example of macro-in-macro usage. macros can contain other macros
  # but they must be previously declared.
  "default_args": "--ctx-size ${default_ctx}"

  # Example of environment variable macros
  # - ${env.VAR_NAME} pulls the value from the system environment
  # - useful for paths, secrets, or machine-specific configuration
  "models_dir": "${env.HOME}/models"

# apiKeys: require an API key when making requests to inference endpoints
# - optional, default: []
# - when empty (the default) authorization will not be checked as llama-swap is default-allow
# - each key is a non-empty string
apiKeys:
  - "sk-hunter2"
  # tip, one liner: printf "sk-%s\n" "$(head -c 48 /dev/urandom | base64 )"
  - "sk-gyCPiKUcIfPlaM4OSMZekkprgijPx6+OsmQs8Rsg0xZ9qpy6gKWsIKqHOk+cgXVx"

  # use environment variable macros to keep secrets out of the config
  - "${env.API_KEY_1}"
  - "${env.API_KEY_2}"

# apiKeys also accepts structured startup keys. Secrets are hashed into the
# SQLite store and are never returned by the control API after startup. The
# scalar form above retains full legacy-admin permissions; structured entries
# should declare only the scopes they need.
#
# This section is the source of truth for the keys it declares: saving the file
# adds and updates them, and removing an entry revokes that key (and the access
# keys nested under it) on the next reload, without a restart. Keys created on
# the API keys page are not touched. A deployment whose store already holds
# keys always needs one that can sign in, so the file cannot remove the last
# management key; the save is rejected and the file rolled back instead.
# apiKeys:
#   - key: "${env.INFERENCE_KEY}"
#     name: "automation"
#     scopes: [inference, logs]
#     models: ["gpt-oss-120b"]

# anthropic.cacheFix: conservative Claude Code prompt-cache repair. `auto`
# requires both a Claude Code signal and Anthropic-shaped request fields.
# anthropic:
#   cacheFix:
#     mode: auto
#     telemetry: true
#     transforms:
#       fingerprintStrip: true
#       sortStabilization: true
#       freshSessionSort: true
#       identityNormalization: true
#       cacheControlNormalize: true
#       ttlManagement: true
#       thinkingSanitize: safe

# audit: raw request/response conversations (including media when enabled).
# Authentication headers and llama-swap secrets are always redacted.
# audit:
#   enabled: true
#   retention: 720h
#   maxBytes: 5GiB
#   storeMedia: true
#   redactHeaders: true

# pricing: models.dev is used only for non-billing cost estimates.
#   ambiguity decides what happens when a model name is priced by several
#   catalog providers: a lone row you edited by hand wins first, then the
#   official vendor's entry (see vendors below), then the serving provider's
#   entry, then the only entry with non-zero rates. "strict" stops before
#   those guesses; "lowest" falls back to the cheapest remaining entry.
#   vendors maps model-name prefixes to the catalog provider that counts as
#   the official vendor. Built-ins (each verified against the catalog):
#   gpt/o1/o3/o4->openai, gemini->google, qwen/qvq/qwq->alibaba, glm->zhipuai,
#   deepseek->deepseek, claude->anthropic, kimi->moonshotai, minimax->minimax,
#   grok->xai, mimo->xiaomi, step->stepfun, mistral/ministral/codestral/
#   devstral/magistral/pixtral/voxtral->mistral, doubao->volcengine,
#   command->cohere, sonar->perplexity, muse->meta, phi->azure, nvidia->nvidia.
#   Entries here override or extend the built-ins.
#   Rows you edit by hand in the pricing panel are never overwritten by a
#   catalog refresh.
# pricing:
#   modelsDev:
#     enabled: true
#     refreshEvery: 24h
#     url: https://models.dev/api.json
#     ambiguity: provider-first
#     vendors:
#       gemini: google

# ============================================================================
# Runtime Manager
# ============================================================================
# The runtime manager is always active and stores every runtime as immutable,
# per-version directories under its root, plus persistent current/previous
# pointers (so an image upgrade never touches installed versions).
#
#   <root>/<name>/versions/<version>/   one immutable install (venv or tree)
#   <root>/<name>/current  ->  versions/<v>      serving pointer
#   <root>/<name>/previous ->  versions/<v>      rollback target
#
# Lifecycle of one version:  Stage (download/build + verify) -> Activate
# (swap current/previous, health-checked) -> Rollback (swap back). The Runtimes
# page in the UI drives all of these; a config change only declares what
# versions a runtime may move between.
#
# Hot reload: runtimes changes apply to the running manager without a restart;
# removing a definition stops its automatic checks but keeps installed
# versions on disk. Only runtimeManager.root / store.path / logToStdout
# changes restart the daemon.
#
# runtimeManager:
#   root: /var/lib/llama-swap/runtimes
#   # Which hosts may be fetched or cloned. Empty or omitted = allow all
#   # HTTPS sources (still HTTPS-only). Pin the exact hosts you trust in
#   # production. Git sources additionally need the API/codeload hosts.
#   sourceAllowlist:
#     - https://pypi.org
#     - https://files.pythonhosted.org
#     - https://github.com
#     - https://api.github.com
#     - https://codeload.github.com
#     - https://release-assets.githubusercontent.com
#   # Registries allowed for container-mode runtimes.
#   containerRegistries: [docker.io, ghcr.io]
#   # Allow download/build work while models are serving (default false: the
#   # manager waits for idle before staging).
#   # buildWhileBusy: false
#   # Upper bound for one stage/activate operation. 0 (default) = unbounded;
#   # source builds can legitimately run for hours, so raise it well above
#   # the longest build you expect (e.g. 4h) rather than leaving a tight cap.
#   # operationTimeout: 4h
#
# ============================================================================
# Runtimes
# ============================================================================
# Each runtime: kind (vllm | llamacpp), optional mode (native | container),
# source (where the version comes from), build (how it is materialized),
# update (version-check policy), verify (optional post-stage checks).
#
# source.type values and what they pair with:
#   pypi      (vllm)      install vllm==<version> from the PyPI index
#   wheel     (vllm)      install one .whl from source.url (checksum optional)
#   release   (vllm)      a GitHub release asset: source.repository +
#                         source.asset template ({tag} / {version} placeholders)
#   git       (both)      clone source.repository, checkout source.ref (exact
#                         tag/branch/commit) or track source.trackRef (the
#                         update loop resolves it to a commit via ls-remote)
#   tag       (both)      like git, ref must be a tag
#   commit    (both)      like git, ref must be a full commit hash
#   release   (llamacpp)  prebuilt archive from a direct source.url
#   channel   (llamacpp)  like release; source.url is a rolling channel asset
#   local     (both)      source.path (or file:// source.url) on this host
#   bundled   (llamacpp)  the llama-server shipped inside the llama-swap image
#   image     (both)      container mode: source.image (+ pullPolicy)
#
# build.driver values:
#   uv      (vllm)        uv venv + uv pip install <package spec> (default)
#   make    (llamacpp)    run make in the source tree (args pass through)
#   cmake   (llamacpp)    configure + build with cmake (default for llamacpp)
#   none    (llamacpp)    no build: prebuilt release/channel archives; the
#                         entrypoint + its shared libraries are materialized
#                         straight from the extracted source layout
#   custom  (both)        run build.steps (shell-free: one command + args per
#                         step, no shell interpretation)
#
# Build steps may reference provider stage macros (expanded at stage time):
#   ${RUNTIME_DIR}  this version's immutable directory
#   ${SOURCE_DIR}   where the source was fetched/extracted (empty for plain
#                   package installs)
#   ${BUILD_DIR}    scratch build directory for this version
#   ${UV} ${PYTHON} (vllm) the uv binary and the version venv's python
# The default working directory is ${SOURCE_DIR} when the source materializes
# a tree (git/local/extracted archives), otherwise the version directory;
# workDir overrides it (relative to the version directory).
#
# update policy (per runtime; defaults shown):
#   policy: automatic|manual|pinned|disabled   (default automatic)
#     automatic  check -> stage -> activate when the idle gates are met
#     manual     only explicit Stage/Activate from the UI or API
#     pinned     operator lock: the loop never even checks
#     disabled   no automatic activity, explicit operations still allowed
#   channel: stable|prerelease                (default stable; prerelease also
#                                              consumes prerelease tags)
#   version:  exact version to keep/target (wins over channel discovery)
#     Changing version to a version that is already installed switches the
#     runtime to it without re-building (stage is a no-op, then activate).
#     Changing it to a new version stages (download/build + verify) first.
#   commit:   (git) exact commit to target
#   checkEvery: 24h                           (default; min 1m)
#   minIdle: 30m                                default; runtime must be idle
#                                              this long before activate
#   activateOnlyWhenIdle: true                default
#   keepVersions: 2                             retention target; current,
#                                              previous and pinned are protected
#   rollbackOnFailure: true                    default; failed activate swaps
#                                              the pointer back to previous
#
# The automatic loop runs one check per runtime per pass (pass every minute,
# checks throttled by checkEvery) and stages/activates only when the runtime
# is idle and the idle-duration gate is met; with models serving and
# buildWhileBusy false it defers and reports waiting_for_idle.
#
# runtimes:
#   # ── vLLM from PyPI: the common case ────────────────────────────────
#   # Stages a uv venv per version; activation health = filesystem checks
#   # plus optional verify.smokeCommand (a GPU is only needed if you add a
#   # smoke test that exercises one).
#   vllm-cuda:
#     kind: vllm
#     source: {type: pypi}
#     build: {python: "3.11"}
#     update: {version: "0.10.0", policy: automatic, channel: stable, minIdle: 30m, keepVersions: 2, rollbackOnFailure: true}
#     verify:
#       healthPath: /health/ready
#       smokeCommand: python -c 'print("runtime ok")'
#
#   # ── vLLM from one official release wheel (direct URL + checksum) ──
#   # Downloads the artifact, verifies sha256, then uv pip installs it;
#   # dependencies still resolve from PyPI.
#   vllm-wheel:
#     kind: vllm
#     source:
#       type: wheel
#       url: https://files.pythonhosted.org/packages/.../vllm-0.10.0-cp39-abi3-manylinux_2_28_aarch64.whl
#       checksum: "sha256:<64 hex digits>"
#     update: {version: "0.10.0", policy: manual}
#     build: {python: "3.11"}
#
#   # ── llama.cpp compiled from git (CPU example) ──────────────────────
#   # git clone --no-checkout + checkout <ref>, then the build driver runs
#   # and the resulting llama-server is materialized to bin/llama-server.
#   # Recent llama.cpp removed the top-level Makefile (it only prints
#   # "Build system changed"), so use the cmake driver:
#   llama-git-cmake:
#     kind: llamacpp
#     source:
#       type: git
#       repository: https://github.com/ggml-org/llama.cpp.git
#       ref: b5999
#     update: {version: b5999, policy: automatic}
#     build:
#       driver: cmake            # runs cmake -S source -B build
#                                # -DGGML_NATIVE=OFF
#                                # -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON (binaries
#                                # keep $ORIGIN-relative RUNPATH after the
#                                # staging dir is renamed into versions/<v>/),
#                                # then cmake --build build
#                                # --target llama-server (parallel)
#       args: ["-DCMAKE_BUILD_TYPE=Release"]   # appended to configure
#       backend: cpu             # adds -DGGML_CPU=ON; e.g. cuda -> -DGGML_CUDA=ON
#       compiler: clang          # adds -DCMAKE_C_COMPILER=clang
#       env: {CMAKE_BUILD_PARALLEL_LEVEL: "8"}
#   # Refs old enough to still ship a working Makefile can use:
#   #   build: {driver: make, args: [-j4], env: {GGML_CUDA: "1"}}
#
#   # ── llama.cpp prebuilt release binary (no compilation) ────────────
#   # Downloads the archive (sha256 verified) and extracts it, keeping the
#   # shared-library symlink chains. The archive's top level is a versioned
#   # directory (llama-bXXXX/), and the prebuilt llama-server carries RUNPATH
#   # $ORIGIN, so driver: none is enough: the manager materializes
#   # source/<version>/llama-server plus every .so next to it under bin/.
#   llama-release:
#     kind: llamacpp
#     source:
#       type: release
#       url: https://github.com/ggml-org/llama.cpp/releases/download/b5999/llama-b5999-bin-ubuntu-arm64.tar.gz
#       checksum: "sha256:<64 hex digits>"
#     update: {version: b5999, policy: automatic}
#     build: {driver: none}
#
#   # ── vLLM fork built from git with custom uv steps ─────────────────
#   # trackRef: the update loop resolves the branch to a commit each check
#   # (git ls-remote only, no clone) and stages it as version git-<sha>.
#   vllm-1cat:
#     kind: vllm
#     source:
#       type: git
#       repository: https://github.com/1CatAI/1Cat-vLLM.git
#       trackRef: refs/heads/main
#     update: {policy: automatic, checkEvery: 24h, minIdle: 30m, keepVersions: 2, rollbackOnFailure: true}
#     build:
#       driver: custom
#       python: "3.12"
#       env:
#         CUDA_HOME: /usr/local/cuda-12.8
#         TORCH_CUDA_ARCH_LIST: "7.0;8.0"
#         FLASH_ATTN_V100_CUDA_ARCH_LIST: "7.0"
#         MAX_JOBS: "12"
#         NVCC_THREADS: "1"
#       steps:
#         - {workDir: "${SOURCE_DIR}", command: "${UV}", args: [pip, install, --python, "${PYTHON}", -r, requirements/build/cuda.txt]}
#         - {workDir: "${SOURCE_DIR}", command: "${UV}", args: [pip, install, --python, "${PYTHON}", -r, requirements/cuda.txt]}
#         - {workDir: "${SOURCE_DIR}", command: "${UV}", args: [pip, install, --python, "${PYTHON}", -r, requirements/common.txt]}
#         - {workDir: "${SOURCE_DIR}", command: "${UV}", args: [pip, install, --python, "${PYTHON}", -r, requirements/build/cuda.txt]}
#         - {workDir: "${SOURCE_DIR}", command: "${UV}", args: [pip, install, --python, "${PYTHON}", --no-build-isolation, --editable, .]}
#   # NOTE for CPU source builds (requirements/build/cpu.txt): the repo pins
#   # torch==<ver>+cpu, which is only published on PyTorch's own CPU index, so
#   # also set in build.env:
#   #     UV_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu/"
#   #     UV_INDEX_STRATEGY: "unsafe-best-match"   # the CPU index also hosts
#   #     some plain packages (e.g. setuptools); without best-match uv
#   #     refuses to look at your primary index for those
#
#   # ── vLLM in a container: the manager only tracks image state ──────
#   vllm-container:
#     kind: vllm
#     mode: container
#     source: {type: image, image: ghcr.io/example/vllm:stable, pullPolicy: always}
#     update: {policy: automatic, checkEvery: 24h, minIdle: 30m, keepVersions: 2}
#     container:
#       engine: docker
#       gpus: all
#       shmSize: 16g
#       command: [serve, /models/Qwen3, --port, "8000"]

# LMCache is an optional KV-cache accelerator for vLLM models. It is NOT
# installed by default: the control panel shows an empty module card until
# enabled.
# The module has two independent parts:
#   - A standalone lmcache server that runs in its own dedicated virtualenv,
#     independent of any vLLM runtime. Enabling the module (from the Runtime
#     Manager page or here) installs it; llama-swap supervises the server as
#     a child process and restarts it on parameter changes.
#   - A connector that the vLLM process imports. When a model enables
#     LMCache (backend.lmcache below), the connector is installed into that
#     model's vLLM runtime virtualenv automatically at model start, pinned
#     to the server's current version. Re-staging a vLLM runtime rebuilds
#     its virtualenv and removes the connector.
# lmcache:
#   # pip requirement name; exact version pin and extras allowed.
#   package: lmcache
#   # Legacy compatibility alias for update.version. Prefer update.version;
#   # if both are present they must match exactly (configuration validation
#   # rejects conflicts and never rewrites this YAML).
#   # version: 0.5.4
#   # interpreter for the server virtualenv; defaults to the documented
#   # LMCache baseline.
#   # pythonVersion: "3.11"
#   # optional HTTPS package index mirror. Still subject to
#   # runtimeManager.sourceAllowlist when that list is set.
#   # indexURL: https://pypi.org
#   # Enable the module: install and supervise the dedicated server runtime.
#   enabled: true
#   # start the standalone server at daemon boot; default true. false defers
#   # the first start to a model's pre-start gate.
#   # autoStart: true
#   # stop the server when the last referencing model stops; default false
#   # keeps the KV cache warm across model turnover.
#   # autoStop: false
#   server:
#     enabled: true
#     # ZMQ endpoint vLLM engines attach to.
#     host: localhost
#     port: 5555
#     # Management frontend. Defaults away from llama-swap's own 8080.
#     httpHost: 127.0.0.1
#     httpPort: 8900
#     # Pinned-DRAM pool ("L2", system memory) size — the server's ONLY memory
#     # tier, rendered as LMCache's --l1-size-gb. Overrides the legacy l1SizeGB
#     # when enabled. KB/MB/GB are powers of 1000, KiB/MiB/GiB are powers of
#     # 1024; a bare number is bytes. Restart-required.
#     # l2:
#     #   enabled: true
#     #   maxBytes: 30GB
#     # Legacy pinned-DRAM size in GB; superseded by l2.maxBytes. Still
#     # accepted, but new configurations should set l2.maxBytes only.
#     # l1SizeGB: 20
#     # Disk tier ("L3"): absolute directory, auto-created. The path must be
#     # writable with enough free space, or the server start fails closed.
#     # maxBytes only sets the minimum free space (default 1 GiB); the LMCache
#     # fs adapter itself has no size cap. Restart-required.
#     # l3:
#     #   enabled: true
#     #   path: /var/lib/lmcache
#     #   maxBytes: 100GB
#     # LRU | IsolatedLRU | noop
#     evictionPolicy: LRU
#     # tokens per cache chunk. 0 (or unset) means auto: the --chunk-size flag
#     # is omitted and the server applies its own library default.
#     # chunkSize: 0
#   # Update policy for the dedicated LMCache server runtime. The standard
#   # version field is update.version; it is authoritative over the legacy
#   # top-level version alias and a version embedded in package. Absent or
#   # empty update.policy means manual-only lifecycle operations. Only an
#   # explicit automatic policy enables background checks/downloads/activation.
#   # A pinned policy stops background work; the UI/API can still perform an
#   # explicit upgrade or rollback. LMCache always rolls back a failed server
#   # health check, so rollbackOnFailure: false is rejected.
#   # update:
#   #   policy: manual # disabled | manual | automatic | pinned
#   #   channel: stable # stable | prerelease
#   #   # version: 0.5.5 # exact version target (standard field)
#   #   checkEvery: 12h
#   #   minIdle: 10m
#   #   activateOnlyWhenIdle: true
#   #   keepVersions: 2
#   #   rollbackOnFailure: true

# resourceBudget is opt-in. It limits locally managed model footprints and
# only evicts models with no in-flight requests when autoEvict is enabled.
# resourceBudget:
#   vramMiB: 24576
#   ramMiB: 32768
#   autoEvict: true
#   queueLoads: true

# upstream: controls behaviour of the /upstream passthrough endpoint
# - optional, default: empty dictionary
# - recommended to only use in special use cases. Leaving it as the
#   default will typically be the best experience
upstream:
  # ignorePaths: list of RE2 compatible regular expressions
  # - default: (see below)
  # - any request to a path matching any of the regular expressions
  #   will be ignored and not trigger a swap
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'

    # ComfyUI specific: ignore /ws and /api/jobs to prevent swaps
    # when the UI is open
    - ^\/ws$|^\/api\/jobs$

# profiles: named model ID replacements switched at runtime through the UI or API
# - optional, default: empty dictionary
# - one profile or none is active; startup and configuration reload select none
# - pins are applied before aliases, filters, and routing
# - targets may be a local model, fully qualified peer model, alias, setParamsByID alias, or selector
# - an empty string or YAML null (~) disables the pin with a 404; it is not
#   added to model listings, while existing local, alias, or peer IDs remain
profiles:
  "coding":
    description: "Coding-focused model routing"
    pins:
      "llm-code": "gpt-oss-120b"
      "llm-plan": "qwen-unlisted"
      "image-gen": ~

# selectors: virtual model IDs resolved to concrete targets per request
# - optional, default: empty dictionary
# - profiles run first, so a profile pin may target a selector
# - selector IDs cannot collide with model IDs, aliases, or fully qualified peer model names
# - selector targets cannot be other selectors
# - selectors are not supported on /upstream/<model> paths
selectors:
  # warm chooses the first ready target in order, then an already-starting
  # target, and cold-starts the first target when none are running
  "coding-model":
    strategy: warm
    targets:
      - "gpt-oss-120b"
      - "qwen-unlisted"
    name: "Coding Model"
    description: "Best currently loaded coding model"
    metadata:
      purpose: coding

  # pin always uses the first target; remaining entries are reference data
  "llm-plan":
    strategy: pin
    targets:
      - "gpt-oss-120b"
      - "z-ai/glm-4.7"

  # spillover fills local or remote targets to the reservation count in order,
  # starting the next target when the active targets reach that count
  "llama":
    strategy: spillover
    targets:
      - "docker-llama"
      - "modelA"
      - "modelB"
    settings:
      # requests reserved per active target before spilling over to the next target
      # - optional, default: 1
      spillover: 4

  # failover retries only connection/load failures and 408/429/502/503/504
  # responses. It buffers an attempt before sending it to the client, so a
  # partial SSE response is never replayed to another backend.
  "resilient":
    strategy: failover
    targets:
      - "gpt-oss-120b"
      - "qwen-unlisted"

# models: a dictionary of model configurations
# - required
# - each key is the model's ID, used in API requests
# - model settings have default values that are used if they are not defined here
# - the model's ID is available in the ${MODEL_ID} macro, also available in macros defined above
# - below are examples of the all the settings a model can have
models:
  # keys are the model names used in API requests
  "gpt-oss-120b":
    # macros: a dictionary of string substitutions specific to this model
    # - optional, default: empty dictionary
    # - macros defined here override macros defined in the global macros section
    # - model level macros follow the same rules as global macros
    macros:
      "default_ctx": 16384
      "temp": 0.7

    # cmd: the command to run to start the inference server.
    # - required
    # - it is just a string, similar to what you would run on the CLI
    # - using `|` allows for comments in the command, these will be parsed out
    # - macros can be used within cmd
    cmd: |
      # ${latest-llama} is a macro that is defined above
      ${latest-llama}
      --model path/to/gpt-oss-120B.gguf
      --ctx-size ${default_ctx}
      --temperature ${temp}

    # A managed backend can use structured argv instead of a shell command.
    # Remove `cmd` when using this shape; the legacy cmd path remains fully
    # compatible and takes precedence when both are present.
    # backend:
    #   type: vllm
    #   runtime: vllm-cuda
    #   # Pin this model to one installed version of its managed runtime so a
    #   # runtime upgrade never changes its environment under it. Omitted:
    #   # follows the runtime's current version (legacy behavior). The pinned
    #   # version must be installed; model start fails closed if it is not.
    #   # runtimeVersion: 0.11.0
    #   protocol: responsesToChat
    #   apis: [chat, completions, responses, embeddings]
    #   args: [vllm, serve, /models/qwen, --host, 127.0.0.1, --port, "${PORT}", --enable-sleep-mode]
    #   # The activity table's drafted (speculative-decoding) acceptance rate is
    #   # only populated when vLLM reports metrics.speculative_decoding, which
    #   # requires starting vLLM with --per-request-spec-decode-metrics summary
    #   # (spec decoding must be enabled via --speculative-config). The 1Cat-vLLM
    #   # fork does not ship that flag yet, so the column stays "-" until it is
    #   # backported. llama-swap parses the field as soon as it is present.
    #   # Explicit vLLM backends receive one best-effort short chat request after
    #   # readiness and before being exposed as ready, to warm the model/cache.
    #   lifecycle: {mode: sleep, sleepLevel: 1}
    #   resources: {vramMiB: 24576, ramMiB: 32768, priority: 10, evictionPriority: 5}
    #   # Attach this vLLM model to LMCache. Requires the top-level lmcache
    #   # module to be enabled and a native managed vLLM runtime; the
    #   # connector is installed into the model's runtime automatically at
    #   # model start.
    #   # mp = standalone lmcache server (recommended); inProcess = legacy
    #   # single-process connector.
    #   lmcache:
    #     enabled: true
    #     mode: mp
    #     role: kv_both # kv_both | kv_producer | kv_consumer
    #     host: localhost # mp: ZMQ host of the lmcache server
    #     port: 5555 # mp: ZMQ port of the lmcache server
    #     chunkSize: 256 # inProcess: 0 keeps the library default

    # name: a display name for the model
    # - optional, default: empty string
    # - if set, it will be used in the v1/models API response
    # - if not set, it will be omitted in the JSON model record
    name: "gpt-oss 120B"

    # description: a description for the model
    # - optional, default: empty string
    # - if set, it will be used in the v1/models API response
    # - if not set, it will be omitted in the JSON model record
    description: "A thinking model from OpenAI"

    # env: define an array of environment variables to inject into cmd's environment
    # - optional, default: empty array
    # - each value is a single string
    # - in the format: ENV_NAME=value
    env:
      - "CUDA_VISIBLE_DEVICES=0,1,2"

    # proxy: the URL where llama-swap routes API requests
    # - optional, default: http://localhost:${PORT}
    # - if you used ${PORT} in cmd this can be omitted
    # - if you use a custom port in cmd this *must* be set
    proxy: http://127.0.0.1:8999

    # checkEndpoint: URL path to check if the server is ready
    # - optional, default: /health
    # - endpoint is expected to return an HTTP 200 response
    # - all requests wait until the endpoint is ready or fails
    # - use "none" to skip endpoint health checking
    checkEndpoint: /custom-endpoint

    # ttl: automatically unload the model after ttl seconds
    # - optional, default: -1 (use global default)
    # - ttl values must be a value greater than or equal to 0
    # - a ttl of -1 will use the global TTL value as the default
    # - a ttl of 0 will mean never unload
    # - a value of 0 disables automatic unloading of the model
    # - for a vLLM backend, ttl > 0 automatically adds --enable-sleep-mode to
    #   the private launch command when the flag is not already configured;
    #   ttl 0 does not add it
    ttl: 60

    # unloadTimeout: graceful timeout in seconds when unloading this model (manual, API, or ttl expiry)
    # - optional, default: global unloadTimeout
    # - a value of 0 uses the global unloadTimeout
    # - useful for slow cmdStop commands such as docker stop
    unloadTimeout: 10

    # compat: compatibility settings for upstream applications
    # - optional, default: empty
    compat:
      # ignoreWebsockets: do not let websocket connections load a stopped model
      # or count toward concurrency, TTL activity, or swap decisions
      # - optional, default: false
      ignoreWebsockets: true

    # useModelName: override the model name that is sent to upstream server
    # - optional, default: ""
    # - useful for when the upstream server expects a specific model name that
    #   is different from the model's ID
    useModelName: "openai/gpt-oss-120B"

    # filters: a dictionary of filter settings
    # - optional, default: empty dictionary
    # - same capabilities as peer filters (stripParams, setParams)
    filters:
      # stripParams: a comma separated list of parameters to remove from the request
      # - optional, default: ""
      # - useful for server side enforcement of sampling parameters
      # - the `model` parameter can never be removed
      # - can be any JSON key in the request body
      # - recommended to stick to sampling parameters
      stripParams: "temperature, top_p, top_k"

      # setParams: a dictionary of parameters to set/override in requests
      # - optional, default: empty dictionary
      # - useful for enforcing specific parameter values
      # - protected params like "model" cannot be overridden
      # - values can be strings, numbers, booleans, arrays, or objects
      # - always runs for the model
      setParams:
        # Example: enforce specific sampling parameters
        temperature: 0.7
        top_p: 0.9

      # setParamsByID: a dictionary of parameters to set based the model ID
      # - optional, default: empty dictionary
      # - combine with aliases to create variant behaviour without reloading
      #   the model; declare each variant name under aliases (keys support
      #   ${MODEL_ID} macro substitution but do not create aliases themselves)
      # - parameters are set in the request body JSON
      # - run after setParams so it will override any settings
      # - protected params like "model" cannot be overridden
      # - values can be strings, numbers, booleans, arrays, or objects
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            reasoning_effort: medium
        "${MODEL_ID}:high":
          chat_template_kwargs:
            reasoning_effort: high
        "${MODEL_ID}:low":
          chat_template_kwargs:
            reasoning_effort: low

    # aliases: alternative model names that this model configuration is used for
    # - optional, default: empty array
    # - aliases must be unique globally
    # - useful for impersonating a specific model
    # - the upstream engine must also serve these names (set useModelName or
    #   backend.launch.servedModelName to one of them), otherwise requests
    #   made with an alias are forwarded unchanged and the engine rejects
    #   them with "The model ... does not exist"
    aliases:
      - "gpt-4o-mini"

    # metadata: a dictionary of arbitrary values that are included in /v1/models
    # - optional, default: empty dictionary
    # - while metadata can contains complex types it is recommended to keep it simple
    # - metadata is only passed through in /v1/models responses
    metadata:
      # port will remain an integer
      port: ${PORT}

      # the ${temp} macro will remain a float
      temperature: ${temp}
      note: "The ${MODEL_ID} is running on port ${PORT} temp=${temp},
        context=${default_ctx}"

      a_list:
        - 1
        - 1.23
        - "macros are OK in list and dictionary types: ${MODEL_ID}"

      an_obj:
        a: "1"
        b: 2
        # objects can contain complex types with macro substitution
        # becomes: c: [0.7, false, "model: llama"]
        c: ["${temp}", false, "model: ${MODEL_ID}"]

    # concurrencyLimit: overrides the allowed number of active parallel requests to a model
    # - optional, default: 0
    # - useful for limiting the number of active parallel requests a model can process
    # - must be set per model
    # - any number greater than 0 will override the internal default value of 10
    # - any requests that exceeds the limit will receive an HTTP 429 Too Many Requests response
    # - recommended to be omitted and the default used
    concurrencyLimit: 0

    # sendLoadingState: overrides the global sendLoadingState setting for this model
    # - optional, default: undefined (use global setting)
    sendLoadingState: false

    # timeouts: configure proxy connection timeouts for this model
    # - optional, defaults shown below
    # - useful for models running on slower hardware that need longer timeouts
    # - connect: TCP dial connection timeout in seconds, default: 30 seconds
    # - keepalive: TCP connection keepalive timeout, default: 30 seconds
    # - responseHeader: time to wait for response headers in seconds, default: 0 (no timeout)
    # - tlsHandshake: TLS handshake timeout in seconds, default: 10 seconds
    # - idleConn: idle connection timeout in seconds, default: 90 seconds
    # - set any value to 0 to disable that timeout (not recommended)
    timeouts:
      connect: 30
      keepalive: 0
      responseHeader: 60
      tlsHandshake: 10
      idleConn: 90

    # disableKeepAlives: open a new upstream connection for every request
    # - optional, default: false
    # - works around upstreams that advertise keep-alive and then close the
    #   connection, such as llama-server after a streamed response (#1205).
    #   Symptom: a request right after a stream fails with 502 "proxy error: EOF"
    # - when true, idle connections are never pooled, so timeouts.idleConn has
    #   no effect for this model
    disableKeepAlives: false

    # capabilities: defines what the model accepts for input, output and other metadata
    # - optional; omitted or all-zero means no capabilities
    # - used in v1/models to inform clients what the model can do
    # - anything left unset here is filled in by automatic discovery: when the
    #   model becomes ready llama-swap asks its upstream what it supports
    #   (llama-server's /props, halogen's /health, or just the model listing)
    #   and remembers the answer. A field set here always wins over discovery.
    # - set disableAuto: true below to keep discovery out of a model entirely
    capabilities:
      # in: list of modalities understood by the model
      # - default: []
      # - valid: text, audio, image, video
      in:
        - text
        - audio
        - image
      # out: list of modalities generated by the model
      # - default: []
      # - valid: text, audio, image, video, decisions
      # - decisions is the only output of llama.cpp decision models, which
      #   answer /v1/systemone and generate no text
      out:
        - text
        - audio
        - image
      # tools: the model supports function calling
      # - default: false
      tools: true

      # reranker: the model supports the /v1/rerank endpoint
      # - default: false
      reranker: false

      # translation: the model is a translation model (e.g. Hy-MT2)
      # - default: false
      translation: false

      # voices: voice IDs answered for GET /v1/audio/voices?model=<id>
      # - optional, default: [] (ask the upstream)
      # - the endpoint is non-standard and upstream answers are unreliable, so
      #   pin the list here for a speech model with a fixed voice set
      # - never rendered into /v1/models
      voices: []

      # context: the maximum token context length supported
      # - default: 0
      # - must be an integer > 0
      context: 32000

      # disableAuto: turn off automatic capability discovery for this model
      # - optional, default: false
      # - discovery only ever fills fields left unset above, so this is for a
      #   model whose upstream reports something you do not want advertised
      disableAuto: false

  # Unlisted model example:
  "unlisted-model":
    # unlisted: boolean, true or false
    # - optional, default: false
    # - unlisted models do not show up in /v1/models api requests
    # - can be requested as normal through all apis
    unlisted: true
    cmd: some-upstream-server

  # Docker example:
  # container runtimes like Docker and Podman can be used reliably with
  # a combination of cmd, cmdStop, and ${MODEL_ID}
  "docker-llama":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      docker run --name ${MODEL_ID}
      --init --rm -p ${PORT}:8080 -v /mnt/nvme/models:/models
      ghcr.io/ggml-org/llama.cpp:server
      --model '/models/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf'

    # cmdStop: command to run to stop the model gracefully
    # - optional, default: ""
    # - useful for stopping commands managed by another system
    # - the upstream's process id is available in the ${PID} macro
    #
    # When empty, llama-swap has this default behaviour:
    # - on POSIX systems: a SIGTERM signal is sent
    # - on Windows, calls taskkill to stop the process
    # - processes have 5 seconds to shutdown until forceful termination is attempted
    cmdStop: docker stop ${MODEL_ID}

  # Structured container form (no shell parsing). The image is pulled by the
  # configured engine and the process layer stops it with the child lifecycle.
  "structured-docker-llama":
    proxy: "http://127.0.0.1:${PORT}"
    backend:
      type: llamacpp
      container:
        engine: docker
        image: ghcr.io/ggml-org/llama.cpp:server
        name: ${MODEL_ID}
        pullPolicy: if-missing
        gpus: all
        mounts:
          - {source: /mnt/nvme/models, target: /models, readOnly: true}
        ports: [{host: 8080, container: 8080}]
        command: [--model, /models/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf]

# hooks: a dictionary of event triggers and actions
# - optional, default: empty dictionary
# - the only supported hook is on_startup
hooks:
  # on_startup: a dictionary of actions to perform on startup
  # - optional, default: empty dictionary
  # - supported actions are preload and profile
  on_startup:
    # profile: profile to activate on startup and after a configuration reload
    # - optional, default: empty string, which starts with no profile active
    # - must name a key under profiles or the configuration fails to load
    # - runtime selection is not persisted, so restarts and reloads return
    #   to this profile
    profile: ""

    # preload: a list of model ids to load on startup
    # - optional, default: empty list
    # - model names must match keys in the models sections
    # - when preloading multiple models at once, define a group
    #   otherwise models will be loaded and swapped out
    preload:
      - "llama"

# routing:
# Controls how llama-swap decides which models can run at the same time and
# which get swapped out. Choose one of three swap engines:
#
# - group:  the default engine. Simpler to configure. You define groups of
#           models that run together, and loading one group typically unloads
#           the others.
#
# - matrix: the most flexible engine. More involved to configure. It uses a
#           small expression language to describe which model combinations
#           are allowed to run concurrently, enabling setups that groups
#           cannot express.
#
# - gpus:   card-level occupancy. You declare which models may occupy each
#           GPU card. Models sharing a card are mutually exclusive (starting
#           one evicts the others on that card); models on disjoint cards run
#           concurrently. A model listed on no card occupies no card and runs
#           alongside everything. Use this when your concurrency rules are
#           simply "who fits on which card".
#
# The routing section is optional.
routing:
  router:
    # use: a string defining which engine to use
    # - optional, default: "group"
    # - valid values: group, matrix, gpus
    use: group

    # settings: a dictionary of settings for the specific engines
    settings:
      # groups: a dictionary of named groups
      # - optional, default: empty dictionary
      # - lets you keep some models loaded while others swap out
      # - every member must be a model ID defined in the models section
      # - a model can belong to only one group
      # - behaviour is set per group with the `swap`, `exclusive` and
      #   `persistent` fields
      # - see issue #109 for details
      #
      # NOTE: the model names below are illustrative and are not defined above.
      groups:
        # group1 reproduces llama-swap's default behaviour: only one model
        # runs at a time across the entire instance.
        "group1":
          # swap: how members of this group swap among themselves
          # - optional, default: true
          # - true:  only one member runs at a time
          # - false: all members can run together, no swapping
          swap: true

          # exclusive: how this group affects other groups
          # - optional, default: true
          # - true:  running a member unloads every other group
          # - false: running a member leaves other groups untouched
          exclusive: true

          # members: the model IDs in this group
          # required
          members:
            - "llama"
            - "qwen-unlisted"

        # group2: members all run together, but loading any other group
        # unloads them.
        "group2":
          # swap: false lets all members stay loaded at once
          swap: false

          # exclusive: false means requesting a member loads it without
          # unloading any other group
          exclusive: false
          members:
            - "docker-llama"
            - "modelA"
            - "modelB"

        # forever: a persistent group that other groups can never unload.
        "forever":
          # persistent: other groups cannot unload this group's members
          # - optional, default: false
          # - has no effect on swapping within the group
          persistent: true

          # swap/exclusive: false keeps all members loaded and avoids
          # unloading other groups
          swap: false
          exclusive: false
          members:
            - "forever-modelA"
            - "forever-modelB"
            - "forever-modelc"

      # The matrix lists the model combinations that are allowed to run
      # concurrently. When a model is requested, the solver makes room for it
      # by evicting as few running models as possible, preferring to keep the
      # costliest ones loaded.
      #
      # Solver behaviour:
      #   1. A request arrives for model X.
      #   2. If X is already running, forward the request. Done.
      #   3. Collect every set that contains X.
      #   4. For each set, add up the evict_costs of the running models that
      #      are NOT in that set — that is the set's cost.
      #   5. Choose the lowest-cost set. Break ties by definition order.
      #   6. Evict the models outside that set, start X, forward the request.
      #
      # Subset semantics: a set [a, b, c] also permits any subset of itself.
      # Only the requested model is started; the others are not preloaded.
      #
      # A model that appears in no set can only run on its own.
      #
      matrix:
        # vars: optional aliases for model IDs
        # - names may contain alphanumeric, "-", or "." characters (1-32 chars)
        # - map each short name to a real model ID (not a model alias)
        # - keeps the set expressions short and readable
        # - sets and evict_costs may mix vars with real model IDs
        # - a var takes precedence when its name is also a real model ID
        vars:
          g: gemma-model
          q: qwen-model
          m: mistral-model
          v: voxtral-model
          e: reranker-model

        # evict_costs: relative cost of losing a running model (default: 1)
        evict_costs:
          v: 50 # vllm backend, slow cold start
          llama-70B: 30 # 70B weights, slow to load

        # sets: named combinations of models that may run together.
        # Each value is an expression built from these operators:
        #   &     AND   (models run together)
        #   |     OR    (alternatives)
        #   ()    grouping
        #   +ref  inline the expression of another set
        #
        # Each expression expands into one or more concrete sets:
        #   "model-a"            → [model-a]
        #   "a & b"              → [a, b]
        #   "a | b"              → [a], [b]
        #   "(a | b) & c"        → [a, c], [b, c]
        #   "(a | b) & (c | d)"  → [a,c], [a,d], [b,c], [b,d]
        #   "+llms & v"          → inline the llms set, then AND with v
        sets:
          # An LLM plus TTS. Vars and real model IDs may be mixed.
          # expands to: [g,v], [qwen-model,v], [m,v]
          standard: "(g | qwen-model | m) & v"

          # An LLM plus TTS plus reranker.
          # expands to: [g,v,e], [q,v,e]
          with_rerank: "(g | q) & v & e"

          # An LLM plus image generation, no TTS.
          # expands to: [g,stable-diffusion], [q,stable-diffusion]
          creative: "(g | q) & stable-diffusion"

          # The 70B model uses every GPU, so it can only run alone.
          # Vars are not required when using real model IDs.
          full: "llama-70B"

      # gpus: the card-occupancy engine. Describe your hardware once, per
      # card: for each GPU card, list the models that may occupy it.
      # - models on the same card are mutually exclusive: starting one
      #   evicts whatever else is running on that card
      # - models on different cards run concurrently
      # - a model listed on several cards occupies all of them (multi-GPU)
      # - a model listed on no card occupies no card (e.g. CPU models) and
      #   runs alongside anything
      #
      # gpus:
      #   "0": [llama, qwen]       # the LLMs share card 0
      #   "1": [voxtral-model]     # TTS keeps card 1 to itself
      #   "2": [stable-diffusion]  # image gen on card 2

  # scheduler: how queued requests are ordered.
  # The default and only valid scheduler is "fifo"
  scheduler:
    use: fifo
    settings:
      fifo:
        # priority: a dictionary of model ID -> priority
        # - optional, default: empty dictionary
        # - models default to priority 0
        # - higher priority requests are serviced first in the queue
        priority:
          A: 10
          B: 5
          C: 5
          D: 1

# peers: a dictionary of remote peers and models they provide
# - optional, default empty dictionary
# - peers can be another llama-swap
# - peers can be any server that provides the /v1/ generative api endpoints supported by llama-swap
# - peer models are always addressable as <peer ID>/<model ID>
# - an unqualified model ID is accepted only when exactly one peer provides it
# - local model IDs and aliases take precedence over unqualified peer model IDs
# - fully qualified peer names are reserved and are the peer IDs shown by /v1/models
peers:
  # keys is the peer'd ID
  llama-swap-peer:
    # proxy: a valid base URL to proxy requests to
    # - required
    # - requested path to llama-swap will be appended to the end of the proxy value
    proxy: http://192.0.2.1
    # models: a list of models served by the peer
    # - required
    models:
      - model_a
      - model_b
      - embeddings/model_c
  openrouter:
    proxy: https://openrouter.ai/api
    # apiKey: a string key to be injected into the request
    # - optional, default: ""
    # - if blank, no key will be added to the request
    # - key will be injected into headers: Authorization: Bearer <key> and x-api-key: <key>
    # - can be a string or a macro
    apiKey: ${env.OPENROUTER_API_KEY}
    models:
      - meta-llama/llama-3.1-8b-instruct
      - qwen/qwen3-235b-a22b-2507
      - deepseek/deepseek-v3.2
      - z-ai/glm-4.7
      - moonshotai/kimi-k2-0905
      - minimax/minimax-m2.1
    # timeouts: configure proxy connection timeouts for this peer
    # - optional, defaults shown below
    # - useful when the peer runs on slower hardware
    # - set any value to 0 to disable that timeout (not recommended)
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 60
      tlsHandshake: 10
      idleConn: 90

    # filters: a dictionary of filter settings for peer requests
    # - optional, default: empty dictionary
    # - same capabilities as model filters (stripParams, setParams)
    filters:
      # stripParams: a comma separated list of parameters to remove from the request
      # - optional, default: ""
      # - useful for removing parameters that the peer doesn't support
      # - the `model` parameter can never be removed
      stripParams: "temperature, top_p"

      # setParams: a dictionary of parameters to set/override in requests to this peer
      # - optional, default: empty dictionary
      # - useful for injecting provider-specific settings like data retention policies
      # - protected params like "model" cannot be overridden
      # - values can be strings, numbers, booleans, arrays, or objects
      setParams:
        # Example: enforce zero-data-retention for OpenRouter
        provider:
          data_collection: "deny"
          zdr: true

# network: outbound proxy policy and, optionally, reverse-proxy trust
# - optional
# - the proxy settings are described in docs/configuration.md
# - trustForwardedFor: honour X-Forwarded-For / X-Real-IP when resolving the
#   caller address
#   - default: false, the TCP peer address is always used
#   - enable only when every request arrives through a reverse proxy you
#     control; a direct client could otherwise claim any address and defeat
#     the per-key allowedIps allowlist
# - trustedProxies: peer addresses or CIDR blocks allowed to supply those
#   headers; requires trustForwardedFor: true
#   - empty uses only the right-most hop (the address the directly connected
#     proxy appended), which is the safe single-switch form
#   - if that appended hop is not a valid address (some proxies write
#     "unknown"), the whole X-Forwarded-For value is ignored and the connection
#     address is used
#   - X-Real-IP is only a fallback when X-Forwarded-For yields no address, so
#     the proxy must overwrite it rather than pass a client value through
#   - set it when several proxies forward to each other, so trusted hops are
#     skipped and the first untrusted address is reported
# network:
#   proxy: http://proxy.example.com:3128
#   noProxy:
#     - localhost
#     - .corp.example.com
#   trustForwardedFor: true
#   trustedProxies:
#     - 127.0.0.1/32
#     - 10.0.0.0/8

# server: HTTP accept-loop limits and defensive response headers
# - optional
# - maxHeaderBytes: request line + headers, default 65536 (4 KiB - 1 MiB)
# - readTimeout: bounds reading one complete request; default 0s disables it
#   so a large payload arriving over a slow link is not cut off
# - securityHeaders: emit nosniff, frame denial, referrer policy, permissions
#   policy and (for the UI) a content security policy; default true
# server:
#   maxHeaderBytes: 65536
#   readTimeout: 0s
#   securityHeaders: true

# security: request-time protections
# - optional
# - authRateLimit throttles failed credential checks per caller address; a
#   successful authentication clears the counter, and only an invalid
#   credential counts (a valid key lacking a scope does not)
# - cors controls the Access-Control-* headers sent to browsers
#   - leaving allowedOrigins out keeps the permissive default: any origin may
#     read responses (what llama-swap did before the setting existed)
#   - setting allowedOrigins restricts that to the listed origins; each entry
#     is a scheme://host[:port] origin with no path. "*" allows any origin
#   - an empty allowedOrigins list is rejected rather than read as "allow all"
#   - allowCredentials sends cookies/Authorization across origins and cannot be
#     combined with "*"
#   - allowPrivateNetwork answers Chrome's Private Network Access preflight and
#     likewise needs explicit origins
#   - allowedOrigins describes who may READ a response. State-changing
#     cross-origin requests to /api/ are always rejected, whatever this says
# security:
#   authRateLimit:
#     disabled: false
#     maxFailures: 10    # failures allowed inside one window
#     window: 1m
#     blockFor: 5m       # rejection period once the limit is reached
#   cors:
#     allowedOrigins:
#       - https://dashboard.example.com
#     allowCredentials: true
#     allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
#     allowedHeaders: [Content-Type, Authorization, Accept, X-Requested-With]
#     exposedHeaders: []
#     maxAge: 86400
#     allowPrivateNetwork: false

# providers: upstream LLM providers served through the gateway forwarding path
# - optional, default: no providers
# - requests for provider models are forwarded to the provider's API
# - provider models are addressable as <provider ID>/<local model ID>, and as
#   the bare local model ID when no local model/peer claims it
# - multiple API keys per provider are scheduled by priority tier with
#   weighted round-robin; failing keys cool down and recover automatically
# - each provider (and each key) can use its own outbound proxy
providers:
  deepseek:
    # type: upstream protocol
    # - optional, default: openai
    # - openai: Authorization: Bearer (DeepSeek, Qwen, Moonshot, OpenRouter, ...)
    # - anthropic: x-api-key + anthropic-version headers
    # - gemini: x-goog-api-key header; clients call the native Gemini paths
    #   (/v1beta/models/<model>:generateContent), forwarded as-is
    type: openai
    # endpoint: base URL of the upstream API
    # - required
    endpoint: https://api.deepseek.com
    # type (adapter level): which API surface this upstream speaks
    # - openai | openai-responses | anthropic | gemini | gemini-interactions
    # - it decides the auth headers AND the request dialect, so one llama-swap
    #   endpoint can serve an OpenAI-Responses client from a Gemini-only
    #   upstream (other client dialects are converted, responses convert back)
    # - gemini-interactions is Google's stateful Interactions API
    #   (/v1beta/interactions): clients send Steps, the response carries a
    #   steps[] transcript plus modality-broken-down usage, and
    #   previous_interaction_id / cached_content stay with this surface
    # proxy (adapter level): outbound proxy for one API surface; a model can
    # override it, and "direct" bypasses every proxy (including this one)
    # - optional, default: "" (inherit the credential, then the provider)
    #   proxy: socks5://127.0.0.1:1080
    # models may carry their own proxy for a single upstream:
    #   models: [{local: glm-5.1, remote: glm-5.1, proxy: direct}]
    # a model may also declare what it accepts and produces, exactly like a
    # local model. The playground uses it to file the model under its tooling
    # (an upstream image model belongs to the image tool, a translation model
    # to the translation tool):
    #   models:
    #     - {local: gpt-image-2, remote: gpt-image-2,
    #        capabilities: {in: [text], out: [image]}}
    #     - {local: hy-mt2, remote: hy-mt2, capabilities: {translation: true}}
    # cooldown: per-provider cooldown policy
    # - optional, default: inherit (the gateway-wide gateway.cooldown settings)
    # - disabled: failures never bench this provider's keys (still recorded,
    #   requests still fail over); enabled: keep cooldowns, and the object form
    #   may override durations: {policy: enabled, auth: 30s, transient: 5s}
    # cooldown: disabled
    # modelPrefix: client-facing prefix for this provider's models
    # - optional, default: "" (model IDs are exposed as-is)
    # - the legacy <providerID>/<model> name keeps working for routing
    # modelPrefix: go-
    # pricingProvider: pricing-catalog provider id for cost estimates
    # - optional, default: this provider's id, lowercased
    # - the estimate looks up (<pricingProvider>, <upstream model name>) in the
    #   models.dev snapshot; a model entry can pin its own entry instead:
    #   models: [{local: glm-5.1, remote: glm-5.1, pricing: {provider: zhipuai}}]
    # pricingProvider: deepseek
    # sessionHeaders: request headers set to the session id when forwarding
    # - optional, default: [] (no injection)
    # - the caller's session id (first non-empty header listed in
    #   ui.activity.session_id) is passed through when present; otherwise a
    #   value derived from the conversation prefix is used
    # sessionHeaders: [X-Session-Id]
    # proxy: provider-level outbound proxy
    # - optional, default: "" (use environment proxies)
    # - http/https/socks5/socks5h URLs; socks5 upgrades to socks5h (remote DNS)
    # - the literal "direct" bypasses all proxies, including environment ones
    # proxy: socks5://127.0.0.1:1080
    # priority / weight: defaults inherited by keys without their own
    # - optional, default: 0 / 0
    # priority: 10
    # weight: 1
    # exposeUpstreamName: keep the upstream model name callable
    # - optional, default: true
    # - a client may address a model by an alias or by the name the upstream
    #   itself uses, and an entry that sets no local name takes that name, so
    #   renaming a model for clients never takes the vendor name away
    # - false publishes only the names this provider declares (local + aliases)
    # exposeUpstreamName: false
    # sticky: session affinity - one conversation sticks to the same upstream
    #   surface (provider + adapter + key)
    # - optional, default: true
    # - a provider's API surfaces keep separate upstream prompt caches, so the
    #   binding is per adapter, not just per provider: a session keeps its cache
    #   even when the pool rotates other conversations to other providers
    sticky: true
    # bareNamePolicy: arbitration for the bare model name when a local model
    #   shares it
    # - optional, default: local-first
    bareNamePolicy: local-first
    # maxRetries: how many times one key is retried before it is benched
    # - optional, default: 2 (so a key gets up to 3 attempts)
    # - 0 tries each key exactly once
    # - only transient failures (5xx, network errors, truncated streams) spend
    #   this budget; 401/402/429 bench the key at once and move to the next one
    maxRetries: 2
    # apiKeys: upstream credentials
    # - required, at least one
    # - each entry is a plain string or an object with: value / valueEnv,
    #   weight, priority, maxConcurrent, proxy, disabled
    apiKeys:
      - ${env.DEEPSEEK_API_KEY}
      - valueEnv: DEEPSEEK_BACKUP_KEY
        weight: 2
        priority: 1
        maxConcurrent: 4
    # quota: display the account's usage/balance on the provider's quota card
    # - optional. "preset" selects a built-in mapping; inline fields override it
    # - preset deepseek reads GET /user/balance (free, not tied to model
    #   concurrency) and shows 可调用 / 总余额 / 赠金 / 充值 / 币种. A balance
    #   has no percentage window, so this mapping is extras-only.
    # - disabled keys are queried too: parking a key to watch its balance is
    #   the point of the card, so it is not limited to schedulable keys.
    # - self-hosted aggregators take the host from the provider endpoint:
    #     quota: {preset: newapi}    -> GET <provider endpoint>/api/usage/token/
    #     quota: {preset: sub2api}   -> GET <provider endpoint>/v1/usage
    #   a custom mapping can use the same "{base}" placeholder:
    #     quota: {endpoint: "{base}/v1/usage", extras: [{id: b, path: balance}]}
    # - an aggregator counting quota in internal units can be scaled:
    #     quota: {preset: newapi, divideBy: 500000}   # 500000 units = 1 USD
    # - windows can be computed from used/limit counters instead of a percent:
    #     windows: [{id: quota, path: data, percent: total_used,
    #                limit: total_granted}]
    # - quota.script runs JavaScript instead of the endpoint/windows mapping.
    #   Two shapes: CC Switch's custom usage script, or an async function.
    #   CC Switch compatible (paste an existing script as-is):
    #     script: |
    #       ({ request: { url: "{{baseUrl}}/v1/usage",
    #                     headers: { "Authorization": "Bearer {{apiKey}}" } },
    #          extractor: (r) => ({ remaining: r.remaining, unit: "USD" }) })
    #   Full control (ctx.fetch is synchronous, call it as often as needed):
    #     script: |
    #       (async (ctx) => {
    #         const r = await ctx.fetch(ctx.baseUrl + "/v1/usage", {
    #           headers: { Authorization: "Bearer " + ctx.apiKey } });
    #         return { extras: [{ id: "balance", label: "余额",
    #                             value: r.json.remaining, suffix: " USD" }] };
    #       })
    #   See docs/quota-scripts.md for the return shape and the field mapping.
    # - enforce: {enabled: true} additionally cools the key down once a window
    #   is full; it needs percentage windows, so it does not apply to a balance
    quota:
      preset: deepseek
    # models: models served by this provider
    # - required, at least one
    # - a string maps the model to itself; an object maps local -> upstream
    #   and may add client-facing aliases for the same upstream model:
    #   - {remote: gemini-4-argon-contributor, local: gemini-4-argon,
    #      aliases: [argon, g4a]}
    models:
      - deepseek-chat
      - deepseek-r1: deepseek-reasoner
    # timeouts: connection timeouts for this provider
    # - optional, defaults shown below
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90

  claude:
    type: anthropic
    endpoint: https://api.anthropic.com
    apiKeys:
      - ${env.ANTHROPIC_API_KEY}
    models:
      - claude-sonnet

  # A subscription whose plan exposes several API surfaces at once uses one
  # provider with multiple adapters. Each adapter has its own dialect,
  # endpoint and model list; the provider credentials are shared unless an
  # adapter overrides them. Add "providers.<id>.quota" to display the plan's
  # usage windows in the UI (see the Go/OpenCode-style example below).
  # One model may be listed by several adapters: those are its API surfaces,
  # and llama-swap picks one without any manual choice. The client's own
  # dialect wins (an Anthropic client reaches the anthropic adapter), other
  # dialects are converted, and an upstream that rejects the request on its
  # surface hands it to the next surface instead of failing the request.
  # Duplicating a name inside ONE adapter stays an error.
  # opencode-go:
  #   apiKeys:
  #     - ${env.OPENCODE_GO_API_KEY}
  #   # The plan documents a stable session header so upstream routing and
  #   # prompt caching can group a conversation.
  #   sessionHeaders: [x-opencode-session]
  #   template: opencode-go
  #   # quota:
  #   #   preset: opencode-go            # built-in usage preset
  #   #   enforce: {enabled: false}      # cool a credential once a window is full
  #   adapters:
  #     - name: Chat
  #       type: openai
  #       endpoint: https://opencode.ai/inference/go
  #       modelMatch: ["glm-*", "kimi-*", "deepseek-*"]
  #       default: true
  #       models:
  #         - kimi-k3
  #     - name: Recent
  #       type: openai
  #       endpoint: https://opencode.ai/inference/go
  #       modelMatch: ["grok-*", "gpt-*"]
  #       models:
  #         - grok-4.7
  #     - name: Messages
  #       type: anthropic
  #       endpoint: https://opencode.ai/inference/go
  #       modelMatch: ["claude-*", "qwen3*", "minimax-*"]
  #       models:
  #         - claude-haiku-5-5
  #     - name: Google
  #       type: gemini
  #       # The upstream serves the Gemini dialect under /v1/models; rewrite
  #       # the client's /v1beta/models/ prefix instead of changing the base.
  #       endpoint: https://opencode.ai/inference/go
  #       pathMap: {"/v1beta/models/": "/v1/models/"}
  #       modelMatch: ["gemini-*"]
  #       models:
  #         - gemini-4-argon-contributor

# gateway: gateway-wide settings for provider forwarding
# - optional, defaults shown below
gateway:
  # stickyTTL: idle expiry for session-affinity entries; hits slide it forward.
  # Affinity is scoped to one conversation *and* one model name.
  stickyTTL: 1h
  # cooldown: cooldown durations per upstream error class
  cooldown:
    auth: 10m        # 401/402; a first 401 only benches authProbe (below), 403 = policy: no cooldown
    # authProbe: 30s  # how long the first 401 benches; 0s disables probing
    rateLimit: 60s   # 429 without Retry-After
    transient: 30s   # 5xx / network errors
  # failover: which upstream responses continue on another key/provider before
  # the client sees the error
  # - a failed attempt is retried while nothing has reached the client yet:
  #   connection EOFs, truncated or empty success responses, and (by default)
  #   every 3xx/4xx/5xx except 413
  # - with crossProvider (default true) a bare model name can continue on
  #   another provider serving the same name; provider/model names stay pinned
  # failover:
  #   crossProvider: false
  #   statuses: [429, 500, 502, 503]      # replace the default set
  #   excludeStatuses: [400]              # hand client-input errors straight back
  # skipSlow: prefer the fastest provider instead of only reacting after a slow
  # one was tried
  # - enabled by default; the latency is measured from THIS deployment's own
  #   traffic (the first content token of a streaming reply), so the rule adapts
  #   to the machine and model instead of encoding numbers that fit one setup
  # - relativeFactor (default 3): a provider more than this many times slower
  #   than the fastest candidate for the same model is passed over. A factor,
  #   not a difference: 2s vs 6s and 5s vs 15s are the same kind of gap.
  # - maxFirstTokenMs (default 0 = off): an absolute ceiling, for when you know
  #   the budget. Left off by default because the right value depends on the
  #   model.
  # - minSamples (default 3): measurements needed before a provider is judged.
  #   Fewer always fail open, so a cold start, a reload (measurements reset) or
  #   a newly added provider is never dropped.
  # - a lone candidate is never skipped, and if every candidate looks slow they
  #   are all kept: turning "this provider is slow" into "this model is
  #   unavailable" would be strictly worse. Observed latency per provider shows
  #   up under GET /api/providers/status (the "latency" map).
  # - probeInterval (default 5m, "0s" disables): how long a skipped provider
  #   stays out of the pool before it is admitted again for one measurement.
  #   Skipping is otherwise self-reinforcing — a provider that is never picked
  #   never produces a new measurement, so its smoothed latency freezes at the
  #   value that excluded it and a provider that recovered could never prove it.
  #   Without probing, one slow period removes a provider for good.
  # skipSlow:
  #   maxFirstTokenMs: 15000   # pass over a provider slower than 15s
  #   relativeFactor: 2.5      # and one more than 2.5x the fastest
  #   minSamples: 5
  #   probeInterval: 10m       # re-test an excluded provider every 10 minutes
  #   enabled: false           # turn it off entirely
  # emptyResponse: retry a success response that carries no model output
  # - a provider occasionally answers 200 and then produces nothing: a
  #   lifecycle-only stream (response.created, then stops), an empty choices
  #   array, a truncated tool call. Nothing has reached the client at that
  #   point, so the request continues on the next credential or provider
  #   instead of leaving the caller an empty "successful" answer that breaks
  #   whatever runs downstream.
  # - retry (default true): set false to commit such a response as-is.
  # - hold (default 15s): how long a stream may be inspected before its first
  #   content. Content normally arrives well before this; after the hold the
  #   response is committed and streamed unchanged, so a slow provider is
  #   never mistaken for a broken one. 0 disables stream inspection
  #   (whole-body responses are still checked).
  # emptyResponse:
  #   retry: true
  #   hold: 15s
