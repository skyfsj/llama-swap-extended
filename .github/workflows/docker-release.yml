name: Docker Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to current checkout)"
        required: false
        default: ""
      platforms:
        description: "Comma-separated backends: cuda,vulkan,rocm"
        required: false
        default: "cuda,vulkan,rocm"
      variants:
        description: "Comma-separated variants: full,llamacpp,vllm,1cat-vllm"
        required: false
        default: "full,llamacpp,vllm,1cat-vllm"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - id: set
        env:
          PLATFORMS: ${{ inputs.platforms || 'cuda,vulkan,rocm' }}
          VARIANTS: ${{ inputs.variants || 'full,llamacpp,vllm,1cat-vllm' }}
        run: |
          # Build the backend x variant cross product, skipping invalid
          # combinations (1cat-vllm is CUDA-only).
          images="[]"
          images=$(python3 -c "
          import json, os
          images = []
          for backend in os.environ['PLATFORMS'].split(','):
              backend = backend.strip()
              for variant in os.environ['VARIANTS'].split(','):
                  variant = variant.strip()
                  if variant == '1cat-vllm' and backend != 'cuda':
                      continue
                  tag = 'unified-' + backend if variant == 'full' else variant + '-' + backend
                  images.append({'backend': backend, 'variant': variant, 'tag': tag})
          print(json.dumps(images))
          ")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve llama-swap version for the build
        id: version
        run: |
          if [[ -n "${{ inputs.ref }}" ]]; then
            echo "ls_version=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "ls_version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.image.variant }}-${{ matrix.image.backend }}
        env:
          DOCKER_IMAGE_TAG: ${{ env.IMAGE_BASE }}:${{ matrix.image.tag }}
          LS_VERSION: ${{ steps.version.outputs.ls_version }}
        run: |
          chmod +x docker/unified/build-image.sh
          ARGS="--${{ matrix.image.backend }}"
          if [[ "${{ matrix.image.variant }}" != "full" ]]; then
            ARGS="$ARGS --variant ${{ matrix.image.variant }}"
          fi
          docker/unified/build-image.sh $ARGS

      - name: Push image and date tag
        env:
          BASE: ${{ env.IMAGE_BASE }}:${{ matrix.image.tag }}
        run: |
          docker push "${BASE}"
          DATE_TAG="${BASE}-$(date -u +%Y-%m-%d)"
          docker tag "${BASE}" "${DATE_TAG}"
          docker push "${DATE_TAG}"

      # GHCR creates the first version of a package as PRIVATE even for
      # public repositories, which breaks anonymous docker pulls. Link the
      # package to this repository and flip it public once it exists.
      - name: Make package public
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="$(echo "${{ github.repository }}" | cut -d/ -f2)"
          for attempt in 1 2 3 4 5; do
            if gh api \
                 --method PATCH \
                 "/user/packages/container/${PACKAGE_NAME}/visibility" \
                 -f visibility=public >/dev/null 2>&1; then
              echo "package visibility set to public"
              break
            fi
            echo "attempt ${attempt}: package not found yet (first push may still be processing)"
            sleep 15
          done
