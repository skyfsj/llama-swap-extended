# placeholder example configuration
healthCheckTimeout: 300
logRequests: true

# Incident snapshots for inference crashes and failed HTTP requests.
# logStorage:
#   path: /var/lib/llama-swap/logs
#   maxFiles: 5

runtimeManager:
  root: /var/lib/llama-swap/runtimes

runtimes:
  llamacpp:
    kind: llamacpp
    mode: native
    source:
      type: bundled
      path: /opt/llama-swap/runtimes/llamacpp
    update:
      policy: manual
      version: bundled

# LMCache is an optional KV-cache accelerator for vLLM. It is NOT installed
# by default; enable it from the Runtime Manager page once an active vLLM
# runtime exists, or configure it here (see the root config.example.yaml for
# the full lmcache server options).
# lmcache:
#   enabled: false
#   server:
#     enabled: false

models:
  "llama":
    backend:
      type: llamacpp
      runtime: llamacpp
      args:
        - llama-server
        - -hf
        - bartowski/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
        - --port
        - ${PORT}

  "whisper":
    checkEndpoint: /v1/audio/transcriptions/
    cmd: >
      whisper-server
      --port ${PORT}
      --m /models/whisper.bin
      --flash-attn
      --request-path /v1/audio/transcriptions --inference-path ""

  "audio":
    checkEndpoint: /health
    # audiocpp_server takes its own JSON config listing the models it serves.
    # Copy the starter shipped in the image -- it already has this image's
    # backend set -- and replace the example models with your own:
    #   docker run --rm --entrypoint cat <image> \
    #     /etc/llama-swap/audiocpp-server.example.json > /models/audiocpp-server.json
    cmd: |
      audiocpp_server
      --config /models/audiocpp-server.json
      --port ${PORT}

  "image":
    proxy: "http://127.0.0.1:9999"
    checkEndpoint: /
    cmd: |
      /app/sd-server
      --listen-port 9999
      --diffusion-fa
      --diffusion-model /models/z_image_turbo-Q8_0.gguf
      --vae /models/ae.safetensors
      --llm /models/qwen3-4b-instruct-2507-q8_0.gguf
      --offload-to-cpu
      --cfg-scale 1.0
      --height 512 --width 512
      --steps 8
